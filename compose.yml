# Ambiente local: constrói as imagens a partir do código deste repositório.
# Os segredos vêm do arquivo .env (fora do git). Modelo em .env.example.
services:
  mysql:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    container_name: mysql-chupinvet
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chupinvet
      MYSQL_USER: chupinvet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: chupinvet-api
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chupinvet
      SPRING_DATASOURCE_USERNAME: chupinvet
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  mysql_data: